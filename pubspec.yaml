name: ohmypi
description: "Android client for the ohmypi gateway"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.4

# Versions pinned exactly. Every dependency is justified in README.md.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  http: 1.6.0
  flutter_secure_storage: 11.2.0
  shared_preferences: 2.5.5
  flutter_markdown_plus: 1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  mocktail: 1.0.5

flutter:
  uses-material-design: true
